<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      Jonathan Medrano — Desarrollador Full Stack | React · TypeScript · .NET
    </title>
    <meta
      name="description"
      content="Desarrollador full stack con foco en front-end. Migré 28 de los ~65 módulos de un ERP de facturación a React + TypeScript, y construyo mis propios SaaS: uno en producción, cobrando con Mercado Pago."
    />
    <meta name="author" content="Jonathan Medrano" />
    <link rel="canonical" href="https://jonathanmedrano.vercel.app/" />

    <!-- Open Graph: this is what a recruiter sees when the link gets pasted
         into LinkedIn, WhatsApp or Slack. Without it, the preview is blank. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jonathanmedrano.vercel.app/" />
    <meta
      property="og:title"
      content="Jonathan Medrano — Desarrollador Full Stack"
    />
    <meta
      property="og:description"
      content="React · TypeScript · C#/.NET · Node. Productos propios, uno en producción con clientes."
    />
    <meta property="og:locale" content="es_AR" />
    <!-- URL ABSOLUTA, no relativa: LinkedIn, WhatsApp y Slack descartan las
         rutas relativas y la preview queda en blanco. Si el dominio cambia,
         estas tres URLs cambian con él.
         La imagen se regenera con `npm run og` desde scripts/og-card.html. -->
    <meta
      property="og:image"
      content="https://jonathanmedrano.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Jonathan Medrano — Desarrollador Full Stack"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://jonathanmedrano.vercel.app/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
