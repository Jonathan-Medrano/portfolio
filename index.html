<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jonathan Medrano — Desarrollador Full Stack</title>
    <meta
      name="description"
      content="Desarrollador full stack con ~2 años de experiencia. Lidero la migración de un ERP de facturación electrónica a React + TypeScript y construyo mis propios SaaS, uno en producción cobrando con Mercado Pago."
    />
    <meta name="author" content="Jonathan Medrano" />

    <!-- Open Graph: this is what a recruiter sees when the link gets pasted
         into LinkedIn, WhatsApp or Slack. Without it, the preview is blank. -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Jonathan Medrano — Desarrollador Full Stack"
    />
    <meta
      property="og:description"
      content="React · TypeScript · .NET · Node. Productos propios, uno en producción."
    />
    <meta property="og:locale" content="es_AR" />
    <!-- TODO(jona): al desplegar, cambiá esto por la URL ABSOLUTA
         (https://tudominio.com/og-image.png). Varias plataformas ignoran las
         rutas relativas y la preview vuelve a quedar vacía.
         La imagen se regenera con `npm run og` desde scripts/og-card.html. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jonathan Medrano — Desarrollador Full Stack" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
